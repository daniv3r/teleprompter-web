name: Publish verified website to GitHub Pages

# No deployment on push. Run manually only after public inputs and review are complete.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website repository
        uses: actions/checkout@v6
      - name: Verify the website builder
        run: python3 -m unittest discover -s tests -v
      - name: Enforce publication checks and build
        run: python3 build.py --publish-check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
